<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watson's | Shiloh Hilada RN Pharmacist/Owner</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root {
    --pink:#ff69b4;
    --light-pink:#ffd6ec;
    --accent:#ff1493;
    --white:#ffffff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', sans-serif;}

body{
    background: linear-gradient(135deg, #ffd6ec, #ffe6f5);
    min-height:100vh;
}

header{
    text-align:center;
    padding:20px;
}

header h1{
    font-family:'Great Vibes', cursive;
    color:var(--accent);
    font-size:40px;
}

header p{color:#555;}

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
}

.profile{
    text-align:center;
    margin:20px 0;
}

.profile .avatar{
    width:100px;height:100px;border-radius:50%;
    background:var(--pink);
    display:flex;align-items:center;justify-content:center;
    color:white;font-size:40px;margin:auto;
}

.profile h2{margin-top:10px;color:#333;}

.section-title{
    margin:30px 0 10px;
    color:var(--accent);
    font-weight:600;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.card{
    background:rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    padding:15px;
    border-radius:20px;
    text-align:center;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card:hover{
    transform:translateY(-5px) scale(1.03);
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:15px;
}

.card h4{margin:10px 0;color:#333;}
.card p{font-size:14px;color:#666;}

button{
    margin-top:10px;
    padding:10px 15px;
    border:none;
    border-radius:25px;
    background:var(--pink);
    color:white;
    cursor:pointer;
}

button:hover{background:var(--accent);}

.cart{
    position:fixed;
    top:20px;
    right:20px;
    background:white;
    padding:10px 15px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    cursor:pointer;
}

.footer{
    text-align:center;
    margin:30px;
    color:#888;
}

</style>
</head>
<body>

<div class="cart" onclick="viewCart()">🛒 Cart (<span id="cartCount">0</span>)</div>

<header>
    <h1>Watson's Beauty & Health</h1>
    <p>Managed by Shiloh Hilada, RN | Pharmacist | Owner</p>
</header>

<div class="container">

<div class="profile">
    <div class="avatar">💖</div>
    <h2>Shiloh Hilada</h2>
</div>

<h3 class="section-title">Featured Products</h3>
<div class="products" id="productList"></div>

</div>

<div class="footer">© 2026 Watson's | Shiloh Hilada</div>

<script>
const products = [
    {name:"Vitamin C Serum", price:299, img:"https://images.unsplash.com/photo-1600185365483-26d7c2d0f5d4"},
    {name:"Moisturizer Cream", price:199, img:"https://images.unsplash.com/photo-1585386959984-a4155224a1ad"},
    {name:"Face Mask Pack", price:149, img:"https://images.unsplash.com/photo-1616394584738-fc6e612e71b9"},
    {name:"Pain Relief Tablets", price:99, img:"https://images.unsplash.com/photo-1580281657527-47a53e4e3a64"},
    {name:"Shampoo Deluxe", price:249, img:"https://images.unsplash.com/photo-1585238342028-4c5c91c3c2db"},
    {name:"Lip Gloss", price:129, img:"https://images.unsplash.com/photo-1586495777744-4413f21062fa"}
];

let cart = [];

function displayProducts(){
    const container = document.getElementById('productList');
    container.innerHTML = "";

    products.forEach((p, index)=>{
        container.innerHTML += `
        <div class="card">
            <img src="${p.img}">
            <h4>${p.name}</h4>
            <p>₱${p.price}</p>
            <button onclick="addToCart(${index})">Add to Cart</button>
        </div>`;
    });
}

function addToCart(index){
    cart.push(products[index]);
    document.getElementById('cartCount').innerText = cart.length;
}

function viewCart(){
    let items = cart.map(p => p.name + " - ₱" + p.price).join("\n");
    alert("Your Cart:\n" + (items || "Empty"));
}

displayProducts();
</script>

</body>
</html>
